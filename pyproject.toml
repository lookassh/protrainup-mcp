[project]
name = "protrainup-mcp"
version = "0.1.0"
description = "MCP server exposing the undocumented ProTrainUp mobile API (api.protrainup.com) to AI agents such as Hermes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
protrainup-mcp = "protrainup_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protrainup_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
